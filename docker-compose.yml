services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oca
      POSTGRES_PASSWORD: oca
      POSTGRES_DB: oca
    ports:
      # ພອດຝັ່ງເຄື່ອງປ່ຽນໄດ້ຜ່ານ POSTGRES_PORT ຖ້າຊົນກັບ Postgres ອື່ນ (ພອດໃນ container ຍັງເປັນ 5432)
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
